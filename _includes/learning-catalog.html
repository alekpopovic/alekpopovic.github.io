<script type="application/json" data-reading-catalog data-learning-catalog>{"books":[{% for book in site.data.books %}{"id":{{ book.id | jsonify }},"title":{{ book.title | jsonify }},"url":{{ book.url | jsonify }},"chapters":[{% for chapter in book.chapters %}{"url":{{ chapter.url | jsonify }},"title":{{ chapter.title | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}{% unless forloop.last %},{% endunless %}{% endfor %}],"starts":{{ site.data.learning_starts | jsonify }},"paths":[{% for path in site.data.learning_paths %}{"id":{{ path.id | jsonify }},"title":{{ path.title | jsonify }},"url":{{ '/learn/' | append: path.id | append: '/' | jsonify }},"outcome":{{ path.outcome | jsonify }},"steps":{{ path.steps.size }},"step_items":[{% for step in path.steps %}{"title":{{ step.title | jsonify }},"url":{{ step.url | jsonify }},"exercise":{{ step.exercise | jsonify }},"evidence":{{ step.evidence | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}],"questions":[{% for question in site.data.knowledge_checks[path.id].questions %}{"id":{{ question.id | jsonify }},"options":{{ question.options.size }},"answer":{{ question.answer | jsonify }},"prompt":{{ question.prompt | jsonify }},"url":{{ question.url | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}{% unless forloop.last %},{% endunless %}{% endfor %}],"workshops":[{% for workshop in site.data.workshops %}{"id":{{ workshop.id | jsonify }},"title":{{ workshop.title | jsonify }},"url":{{ '/ai/workshops/?exercise=' | append: workshop.id | append: '#workshop-lab' | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]}</script>
