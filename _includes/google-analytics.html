{% if site.google_analytics and site.google_analytics != '' %}
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics | uri_escape }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', {{ site.google_analytics | jsonify }}, {
    page_location: window.location.origin + window.location.pathname,
    page_referrer: (function () { try { return document.referrer ? new URL(document.referrer).origin : ''; } catch { return ''; } })()
  });
</script>
{% endif %}
