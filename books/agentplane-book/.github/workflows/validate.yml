name: Validate book
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sources-and-examples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.13'
      - name: Install publication dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes pandoc libpango-1.0-0 libpangoft2-1.0-0 fonts-dejavu-core
          python -m pip install -r requirements.txt
      - name: Record runner tools
        run: |
          python --version
          go version
          pandoc --version
      - name: Verify sources and teaching examples
        run: make verify
      - name: Build every reading edition
        run: make book
      - name: Verify regenerated source links
        run: python scripts/check.py
