<svg xmlns="http://www.w3.org/2000/svg" width="920" height="615" viewBox="0 0 920 615">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0L8,4L0,8Z" fill="#426c77"/></marker></defs>
<rect width="920" height="615" fill="white"/>
<rect x="35" y="20" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">01  Authorize enrollment</text>
<text x="220.0" y="78.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Short-lived, scoped token</text>
<rect x="515" y="20" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">02  Generate key locally</text>
<text x="700.0" y="78.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Private key never leaves cluster</text>
<rect x="515" y="175" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="207.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">03  Submit CSR over TLS</text>
<text x="700.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Bind proof and token identity</text>
<rect x="35" y="175" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="207.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">04  Validate and consume token</text>
<text x="220.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Atomic single-use boundary</text>
<rect x="35" y="330" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="362.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">05  Sign certificate externally</text>
<text x="220.0" y="388.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Short-lived cluster identity</text>
<rect x="515" y="330" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="362.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">06  Protect local key storage</text>
<text x="700.0" y="388.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">No key material in SaaS logs</text>
<rect x="515" y="485" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="517.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">07  Authenticate the stream</text>
<text x="700.0" y="543.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Check current certificate status</text>
<rect x="35" y="485" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="517.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">08  Rotate and revoke</text>
<text x="220.0" y="543.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Reject stale or revoked authority</text>
