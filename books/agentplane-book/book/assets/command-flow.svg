<svg xmlns="http://www.w3.org/2000/svg" width="920" height="615" viewBox="0 0 920 615">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0L8,4L0,8Z" fill="#426c77"/></marker></defs>
<rect width="920" height="615" fill="white"/>
<rect x="35" y="20" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">01  Authorize operation</text>
<text x="220.0" y="78.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Scope + stable request identity</text>
<rect x="515" y="20" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">02  Commit one transaction</text>
<text x="700.0" y="78.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Intent + audit + outbox</text>
<rect x="515" y="175" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="207.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">03  Publish durable event</text>
<text x="700.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Retry without changing identity</text>
<rect x="35" y="175" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="207.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">04  Deliver through JetStream</text>
<text x="220.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Duplicates remain possible</text>
<rect x="35" y="330" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="220.0" y="362.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">05  Check local command</text>
<text x="220.0" y="388.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Scope + expiry + epoch + bounds</text>
<rect x="515" y="330" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="362.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">06  Record and perform effect</text>
<text x="700.0" y="388.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Recipient-side operation identity</text>
<rect x="515" y="485" width="370" height="90" rx="10" fill="#eef6f6" stroke="#477b83" stroke-width="2"/>
<text x="700.0" y="517.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">07  Persist and reconcile result</text>
<text x="700.0" y="543.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Report a verified outcome</text>
<rect x="35" y="485" width="370" height="90" rx="10" fill="#fcf1df" stroke="#a7793e" stroke-width="2"/>
<text x="220.0" y="517.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">UNKNOWN OUTCOME</text>
<text x="220.0" y="543.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Effect occurred; result was lost</text>
