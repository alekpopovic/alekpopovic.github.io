<text x="220.0" y="52.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">01  Authenticate request</text>
<text x="220.0" y="78.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#183e49">Exact scope + operation</text>
