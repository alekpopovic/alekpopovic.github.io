# SPDX-License-Identifier: MIT
# Proposed syntax only. Server-side environment policy remains authoritative.
apiVersion: ci/v1
name: approved-release
triggers:
  manual: true
jobs:
  verify:
    pool: trusted-linux
    toolchain: go-stable
    checkout: true
    commands:
      - go test ./...
  image:
    needs: [verify]
    pool: trusted-linux
    checkout: true
    build:
      type: oci
      dockerfile: Dockerfile
      registry: project-registry
  deploy:
    needs: [image]
    pool: production-deploy
    environment: production
    approval: required
    deploy:
      target: application-production
      artifact: image.image_digest
