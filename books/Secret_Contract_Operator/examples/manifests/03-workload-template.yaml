# NE PRIMENJUJ pre zamene image placeholdera proverljivim test image digest-om.
# Test aplikacija ne sme da ispisuje promenljive okruzenja ni Secret vrednosti.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-api
  namespace: sco-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sco-demo-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sco-demo-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: api
          image: YOUR_TEST_IMAGE_BY_DIGEST
          env:
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: DB_USERNAME
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-secrets
                  key: DB_PASSWORD
