<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0B7E83" /></marker></defs><rect width="1000" height="520" rx="18" fill="#F2F6F8" /><rect x="35" y="40" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#CCD9E2" stroke-width="2" /><text x="53" y="75" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#10263D">01  Load contract</text><text x="53" y="103" font-family="DejaVu Sans, sans-serif" font-size="17.5" fill="#5B6E80">Check scope and approval</text><rect x="365" y="40" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#CCD9E2" stroke-width="2" /><text x="383" y="75" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#10263D">02  Read Secret</text><text x="383" y="103" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#5B6E80">Retain only UID / RV</text><rect x="695" y="40" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#CCD9E2" stroke-width="2" /><text x="713" y="75" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#10263D">03  Evaluate</text><text x="713" y="103" font-family="DejaVu Sans, sans-serif" font-size="15.8" fill="#5B6E80">Spec + data + dependencies</text><path d="M 308 89 L 361 89" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" /><path d="M 638 89 L 691 89" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" /><rect x="35" y="345" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#CCD9E2" stroke-width="2" /><text x="53" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#10263D">06  Wait for event</text><text x="53" y="408" font-family="DejaVu Sans, sans-serif" font-size="15.9" fill="#5B6E80">Watch or scheduled deadline</text><rect x="365" y="345" width="270" height="100" rx="12" fill="#10263D" stroke="#10263D" stroke-width="2" /><text x="383" y="380" font-family="DejaVu Sans, sans-serif" font-size="21.7" font-weight="bold" fill="#FFFFFF">05  Publish change</text><text x="383" y="408" font-family="DejaVu Sans, sans-serif" font-size="17.7" fill="#CCD9E2">Write only changed status</text><rect x="695" y="345" width="270" height="100" rx="12" fill="#FFFFFF" stroke="#CCD9E2" stroke-width="2" /><text x="713" y="380" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#10263D">04  Build result</text><text x="713" y="408" font-family="DejaVu Sans, sans-serif" font-size="19" fill="#5B6E80">No raw errors</text><path d="M 830 143 L 830 341" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" /><path d="M 691 395 L 639 395" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" /><path d="M 361 395 L 309 395" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" /><path d="M 34 393 L 14 393 L 14 90 L 31 90" fill="none" stroke="#0B7E83" stroke-width="3" marker-end="url(#arr)" stroke-dasharray="7 6" /><text x="56" y="229" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5B6E80">Negative finding: Ready=False</text><text x="56" y="261" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5B6E80">API error: no false success</text><text x="365" y="229" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5B6E80">Mutation is outside the read-only MVP</text><text x="365" y="261" font-family="DejaVu Sans, sans-serif" font-size="18" fill="#5B6E80">A no-op observation causes no write</text></svg>